{# block.section_eyebrow, block.section_title, block.category_code, block.limit #}
<section class="z-blog-grid-section z-fluid z-capped">
  <div class="z-blog">
    {% if block.section_eyebrow or block.section_title %}
    <h2 class="z-blog-section-label">{{ block.section_eyebrow ?: block.section_title }}</h2>
    {% endif %}

    {% partial 'blog/posts-by-category' code=block.category_code limit=block.limit ?: 3 %}
  </div>
</section>
